name: Keep Streamlit Alive

on:
  schedule:
    # Run every 6 hours — Streamlit Cloud sleeps after 12 hours of no traffic
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit Streamlit app with headless browser
        run: |
          python -c "
          import asyncio
          from playwright.async_api import async_playwright

          async def visit():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  print('Loading Streamlit app...')
                  try:
                      await page.goto('https://rag-doc-assistant-rakesh.streamlit.app/', timeout=120000)
                      # Wait for app to fully load (WebSocket established)
                      await page.wait_for_timeout(15000)

                      # Check if app is sleeping and click wake-up button if present
                      wake_btn = page.locator('button:has-text(\"Yes, get this app back up\")')
                      if await wake_btn.count() > 0:
                          print('App is sleeping — clicking wake-up button...')
                          await wake_btn.click()
                          # Wait for app to boot
                          await page.wait_for_timeout(60000)
                          print('App woken up successfully!')
                      else:
                          print('App is awake — visit registered.')

                      print(f'Page title: {await page.title()}')
                  except Exception as e:
                      print(f'Error: {e}')
                  finally:
                      await browser.close()

          asyncio.run(visit())
          "
