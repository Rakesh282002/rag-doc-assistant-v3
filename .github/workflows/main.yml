name: Repo Keepalive

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create empty commit to keep repo active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "${GITHUB_REF_NAME:-main}"
          git commit --allow-empty -m "Monthly repo keepalive"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
