name: Repo Keepalive

on:
  schedule:
    - cron: "0 12 1 * *"   # monthly, e.g. 12:00 UTC on day 1
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create empty commit to keep repo active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Monthly repo keepalive"
          git push
